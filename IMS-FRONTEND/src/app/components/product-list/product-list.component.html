<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Products</h2>
    <button class="btn btn-primary" (click)="addProduct()">
      <i class="fas fa-plus me-2"></i>Add Product
    </button>
  </div>

  <!-- Products Table -->
  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead class="table-dark">
            <tr>
              <th>Image</th>
              <th>Name</th>
              <th>Description</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Category</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let product of products">
              <td>
                <div *ngIf="getProductImages(product).length; else emptyProductImage" class="product-image-gallery">
                  <button
                    *ngFor="let imageUrl of getProductImages(product); let imageIndex = index"
                    type="button"
                    class="product-image-button"
                    (click)="openImageViewer(imageUrl, product.name, imageIndex)"
                    [attr.aria-label]="'View image ' + (imageIndex + 1) + ' of ' + product.name">
                    <img [src]="imageUrl" [alt]="product.name + ' image ' + (imageIndex + 1)" class="product-image">
                  </button>
                </div>
                <ng-template #emptyProductImage>
                  <div class="no-image">
                  <i class="fas fa-image text-muted"></i>
                  </div>
                </ng-template>
              </td>
              <td>{{ product.name }}</td>
              <td>{{ product.description }}</td>
              <td>${{ product.price | number:'1.2-2' }}</td>
              <td>
                <span
                  [class]="'badge ' + (product.quantity > 10 ? 'bg-success' : product.quantity > 0 ? 'bg-warning' : 'bg-danger')">
                  {{ product.quantity }}
                </span>
              </td>
              <td>{{ getCategoryName(product.category) }}</td>
              <td>
                <div class="btn-group" role="group">
                  <button class="btn btn-warning btn-sm me-2" (click)="editProduct(product.id!)">
                    <i class="fas fa-edit me-1"></i>Edit
                  </button>
                  <button class="btn btn-danger btn-sm" (click)="deleteProduct(product.id!)">
                    <i class="fas fa-trash me-1"></i>Delete
                  </button>
                </div>
              </td>
            </tr>
            <tr *ngIf="products.length === 0">
              <td colspan="7" class="text-center text-muted">
                No products found. <a (click)="addProduct()" style="cursor: pointer; color: #0d6efd;">Create the first
                  product</a>.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div
  *ngIf="selectedImageUrl"
  class="image-viewer-backdrop"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="selectedImageAlt"
  (click)="closeImageViewer()">
  <button type="button" class="image-viewer-close" aria-label="Close image viewer" (click)="closeImageViewer(); $event.stopPropagation()">×</button>
  <div class="image-viewer-content" (click)="$event.stopPropagation()">
    <img [src]="selectedImageUrl" [alt]="selectedImageAlt" class="image-viewer-full-image">
    <p>{{ selectedImageAlt }}</p>
  </div>
</div>
